[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "windows-x64"]

[tools]
go = "1.27.1"
"aqua:rvben/rumdl" = "latest"
"aqua:tamasfe/taplo" = "latest"

[vars]
rumdl_config = ".config/rumdl.toml"
taplo_config = ".config/taplo.toml"
toml_glob = "**/*.toml"

[env]
CGO_ENABLED = "0"
TAPLO_CONFIG = "{{vars.taplo_config}}"
RUST_LOG = "error"

[tasks.check]
description = "Check all files"
run = [
  "rumdl check --config {{vars.rumdl_config}}",
  "taplo format --check {{vars.toml_glob}}",
  "gofmt -l .",
  "go mod tidy --diff",
  "go vet ./...",
  "go test ./...",
]

[tasks.fix]
description = "Format all files"
run = [
  "gofmt -l -s -w .",
  "go mod tidy -v",
  "rumdl fmt --config {{vars.rumdl_config}}",
  "taplo format {{vars.toml_glob}}",
]

[tasks.build]
description = "Build mcpee binary"
run = ["go build ./cmd/mcpee"]

[tasks.release]
description = "Build release binaries"
usage = '''
arg "<version>" help="Release version, e.g. 0.2.0"
'''
run = [
  "mkdir -p dist",
  "GOOS=windows GOARCH=amd64 go build -trimpath -ldflags=-X=mcpee.Version={{ usage.version }} -o dist/mcpee-windows-amd64.exe ./cmd/mcpee",
  "GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags=-X=mcpee.Version={{ usage.version }} -o dist/mcpee-darwin-arm64 ./cmd/mcpee",
  "GOOS=linux GOARCH=amd64 go build -trimpath -ldflags=-X=mcpee.Version={{ usage.version }} -o dist/mcpee-linux-amd64 ./cmd/mcpee",
]

[tasks.test]
description = "Run tests"
run = ["go test ./..."]

[tasks.run]
description = "Run mcpee"
run = ["go run ./cmd/mcpee"]

[tasks.tag-release]
description = "Create a release tag"
depends = ["check"]
usage = '''
arg "<version>" help="Release version, e.g. 0.1.0"
'''
run = [
  "go run -trimpath -ldflags=-X=mcpee.Version={{ usage.version }} ./cmd/mcpee --version | grep -Fx 'mcpee {{ usage.version }}' >/dev/null",
  "git tag v{{ usage.version }}",
]
run_windows = [
  'cmd /d /s /c ""go run -trimpath -ldflags=-X=mcpee.Version={{ usage.version }} ./cmd/mcpee --version | more | findstr /x /c:"mcpee {{ usage.version }}" >nul""',
  'git tag v{{ usage.version }}',
]

[tasks.push-tags]
description = "Push release tags"
run = ["git push origin --tags"]
